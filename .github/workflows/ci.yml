name: CI
on:
  push:
    branches: [main, master]
  pull_request:
# R38-P1-03: cancel superseded revisions so old runs don't pile up for hours and get cancelled at ~6h. One in-flight run
# per ref; a new push cancels the previous one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    # R38-P1-03: bound the whole job so a hung suite fails fast (visible) instead of running until the 6h platform cap.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: matrix
          POSTGRES_PASSWORD: matrix
          POSTGRES_DB: matrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Syntax check
        run: node --check server.js && node --check db.js && node --check auth.js && node --check riskEngine.js && node --check reconcile.js && node --check feeReconcile.js && node --check orderRecovery.js
      # The FULL suite runs against the ephemeral Postgres so the PG integration + two-instance/lease + restart-recovery
      # + route safety tests actually EXECUTE (they self-skip without DATABASE_URL). With CI=true set by Actions, the
      # ciPgRequired guard turns any PG skip into a CI failure — safety coverage can't silently vanish. R34-P3-06: the
      # full TAP output is captured, the pass/fail/skip counts are extracted, and the run is REJECTED if any safety
      # suite skipped. The report is published as an artifact tied to this exact commit SHA.
      - name: Tests (unit + PostgreSQL integration + two-instance + fault-injection; skips fail CI)
        # R38-P1-03: bound the step, add a per-TEST timeout so one hung integration test fails visibly (instead of the
        # whole job hanging to the platform cap), and a hard `timeout` wrapper as a backstop that still lets the gate run.
        timeout-minutes: 18
        env:
          DATABASE_URL: postgres://matrix:matrix@localhost:5432/matrix_test
        run: |
          set -o pipefail
          mkdir -p artifacts
          # --test-timeout=600000 → a single test wedged >10 min is failed by the runner (catches a true hang) WITHOUT
          # killing the legitimate multi-journey real-Postgres route suites (deltaRouteH07/orderRouteC03/
          # realPositionsCloseS5), which run several minutes each. (R38 first shipped 120000, which was too tight and
          # killed those healthy suites mid-transaction.)
          # `timeout --kill-after` → hard backstop; on expiry Node is killed, the ephemeral PG service is torn down by
          # Actions, and the zero-skip gate below still runs against whatever TAP was captured.
          # R38-P1-03: the *.sandbox.cjs broker-certification + E2E suites are EXCLUDED here (they run in their own
          # dedicated jobs) so the main suite has NO intentional skips — a skip in this run is now a real problem.
          FILES=$(ls test/*.cjs | grep -Ev '\.sandbox\.cjs$')
          # R38: --test-force-exit — the route suites require server.js, which starts background interval workers that
          # keep the event loop alive; without force-exit the node:test FILE test never settles after its subtests pass
          # and times out (this was the long-standing "backend PG job never completes" hang). Force-exit lets the runner
          # finish cleanly once every test has run. --test-concurrency=1 runs the heavy real-Postgres suites SERIALLY so
          # they don't contend on the one CI database. --test-timeout is a per-test hang bound; the step `timeout` backstops.
          timeout --kill-after=30s 22m node --test --test-force-exit --test-concurrency=1 --test-timeout=300000 $FILES 2>&1 | tee artifacts/backend-tests.tap
      - name: Zero-skip safety gate + evidence summary
        if: always()
        run: |
          TAP=artifacts/backend-tests.tap
          PASS=$(grep -c '^ok ' "$TAP" || true)
          FAIL=$(grep -c '^not ok ' "$TAP" || true)
          # Count ONLY real TAP skip directives on test-result lines (e.g. `ok 8 - name # SKIP reason`). The previous
          # `grep -Ec '# (SKIP|skip)'` also matched node:test's own summary line `# skipped N` (because `# skip` is a
          # substring of `# skipped`), so a clean run with zero real skips still reported skipped=1 and failed the gate.
          SKIP=$(grep -Ec '^(ok|not ok) .*# (SKIP|skip)\b' "$TAP" || true)
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "database=postgres:16 (ephemeral service)"
            echo "ci_pg_required=true"
            echo "pass=${PASS}"
            echo "fail=${FAIL}"
            echo "skipped=${SKIP}"
          } | tee artifacts/backend-evidence.txt
          # Safety suites must never skip in a release run (named diagnostic — kept for a precise pointer).
          if grep -Eq '(realPositionsCloseS5|leasesTwoProcess|fenceToSend|orderRouteC03|deltaRouteH07|migrations|eodPgReconcile|R35-P2-04|R35-P3-04).*# (SKIP|skip)' "$TAP"; then
            echo "::error::a safety-tagged suite was SKIPPED — release evidence is invalid"; exit 1
          fi
          # R39-P2-03: GLOBAL zero-skip gate. The main suite is DESIGNED to have no intentional skips (sandbox suites run
          # in their own job; PostgreSQL is required, so PG self-skips already fail via ciPgRequired). Therefore ANY skip
          # means a money-safety test silently vanished — fail on skipped>0 regardless of name, so a NEW or RENAMED safety
          # test can't skip past the named regex above. Release documentation requires global skipped=0.
          if [ "${SKIP:-0}" != "0" ]; then echo "::error::global zero-skip gate: ${SKIP} skipped test(s) in the backend suite (a money-safety test may have silently skipped)"; exit 1; fi
          if [ "${FAIL:-0}" != "0" ]; then echo "::error::backend tests failed"; exit 1; fi
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Upload backend evidence (TAP + summary, per-SHA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-evidence-${{ github.sha }}
          path: artifacts/
          retention-days: 90

  # R34-P3-06: broker-sandbox certification. Runs the FYERS/Delta SANDBOX order-lifecycle + fill-verification tests
  # against the brokers' test environments. It is GATED on repository secrets so forks/PRs without creds don't fail,
  # but when the secrets are present (release runs) it MUST pass and publishes a per-SHA artifact with the literal
  # broker-call outcomes. Enable by setting the *_SANDBOX_* secrets in the repo/environment.
  broker-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # R38-P1-03: a real broker lifecycle is seconds-to-minutes; cap it so a hung network call fails fast.
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Broker sandbox order + fill verification
        env:
          # R35/R37 — certification is REQUIRED in either of two ways:
          #   • vars.REQUIRE_BROKER_CERT=1 (explicit request, any branch), OR
          #   • R37-P1-01: vars.REAL_MONEY_RELEASE=1 on the release branch (main/master). On the real-money release
          #     branch, an un-certified broker path is a NO-GO by DEFAULT — NOT_CONFIGURED FAILS the job. It is no longer
          #     merely a warning that requires someone to remember to flip an optional variable.
          # When certification is required but the complete sandbox secrets are absent, the job FAILS (NOT CERTIFIED /
          # NO-GO). Only on a non-release branch (or PR/dev) with no real-money flag does NOT_CONFIGURED pass, so
          # unrelated work isn't blocked.
          REQUIRE_BROKER_CERT: ${{ vars.REQUIRE_BROKER_CERT }}
          REAL_MONEY_RELEASE: ${{ vars.REAL_MONEY_RELEASE }}
          # R38: which brokers this deployment certifies for real money. Default "delta,fyers". Narrow it (e.g. "delta")
          # to certify only the broker(s) you have a real sandbox for; the others stay honestly NO-GO / uncertified and
          # are neither required nor run. A broker not listed here can never be granted real-money GO by this gate.
          CERT_BROKERS: ${{ vars.CERT_BROKERS }}
          IS_RELEASE_BRANCH: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && '1' || '0' }}
          FYERS_SANDBOX_APP_ID: ${{ secrets.FYERS_SANDBOX_APP_ID }}
          FYERS_SANDBOX_TOKEN: ${{ secrets.FYERS_SANDBOX_TOKEN }}
          # R37-P2-01: place/base/symbol settings the suites need to run a REAL fill→close journey (not read-only).
          FYERS_SANDBOX_BASE: ${{ vars.FYERS_SANDBOX_BASE }}
          FYERS_SANDBOX_SYMBOL: ${{ vars.FYERS_SANDBOX_SYMBOL }}
          FYERS_SANDBOX_MAX_QTY: ${{ vars.FYERS_SANDBOX_MAX_QTY }}
          # R39-P1-05: the isolated-account allow-list — the FYERS suite REFUSES to place unless the authenticated
          # account id is on this list, so a generic credential can never trade an unintended (e.g. personal) account.
          FYERS_SANDBOX_ACCOUNT_ALLOW: ${{ vars.FYERS_SANDBOX_ACCOUNT_ALLOW }}
          DELTA_SANDBOX_KEY: ${{ secrets.DELTA_SANDBOX_KEY }}
          DELTA_SANDBOX_SECRET: ${{ secrets.DELTA_SANDBOX_SECRET }}
          DELTA_SANDBOX_BASE: ${{ vars.DELTA_SANDBOX_BASE }}
          DELTA_SANDBOX_SYMBOL: ${{ vars.DELTA_SANDBOX_SYMBOL }}
          DELTA_SANDBOX_MAX_SIZE: ${{ vars.DELTA_SANDBOX_MAX_SIZE }}
        run: |
          # R36-P1-01: `pipefail` so Node's exit code is NOT masked by tee; `-u` catches unset vars; `-e` stops on error.
          set -euo pipefail
          mkdir -p artifacts
          # R37-P1-01: certification is REQUIRED when explicitly requested OR when this is the real-money release branch.
          REQ_EXPLICIT=$(echo "${REQUIRE_BROKER_CERT:-0}" | grep -Eiq '^(1|true|yes)$' && echo 1 || echo 0)
          REAL_MONEY=$(echo "${REAL_MONEY_RELEASE:-0}" | grep -Eiq '^(1|true|yes)$' && echo 1 || echo 0)
          REQUIRED=0
          [ "$REQ_EXPLICIT" = "1" ] && REQUIRED=1
          [ "$IS_RELEASE_BRANCH" = "1" ] && [ "$REAL_MONEY" = "1" ] && REQUIRED=1
          # R38: brokers this deployment certifies. Default both; narrow via vars.CERT_BROKERS (e.g. "delta").
          CB=$(echo "${CERT_BROKERS:-delta,fyers}" | tr 'A-Z' 'a-z')
          WANT_FYERS=0; echo "$CB" | grep -qw fyers && WANT_FYERS=1
          # R39-P1-03: DELTA is IP-whitelisted at the exchange, so it can NEVER be certified from a GitHub shared runner.
          # It is certified by the dedicated self-hosted `broker-sandbox-delta` job instead. This shared job is FYERS-only.
          WANT_DELTA=0
          if [ "$WANT_FYERS" = "0" ]; then
            echo "broker_sandbox=fyers-not-requested (Delta is certified by the self-hosted broker-sandbox-delta job)" | tee -a artifacts/broker-sandbox.txt
            exit 0
          fi
          # A broker is "requested" for certification only if it has its COMPLETE credential set. A partial set is treated
          # as MISSING (never a partial certification).
          FYERS_OK=0; [ -n "${FYERS_SANDBOX_APP_ID:-}" ] && [ -n "${FYERS_SANDBOX_TOKEN:-}" ] && FYERS_OK=1
          DELTA_OK=0; [ -n "${DELTA_SANDBOX_KEY:-}" ] && [ -n "${DELTA_SANDBOX_SECRET:-}" ] && DELTA_OK=1
          # Build the run list from the WANTED brokers that have complete creds (an unwanted broker's suite is never run —
          # the suite's own guard would throw under BROKER_SANDBOX=1 without its creds, which is correct only for a broker
          # we actually intend to certify).
          FILES=""
          [ "$WANT_DELTA" = "1" ] && [ "$DELTA_OK" = "1" ] && for f in test/deltaTestnet*.cjs; do [ -f "$f" ] && FILES="$FILES $f"; done
          [ "$WANT_FYERS" = "1" ] && [ "$FYERS_OK" = "1" ] && for f in test/fyersSandbox*.cjs; do [ -f "$f" ] && FILES="$FILES $f"; done
          # The suite files for wanted brokers must EXIST on disk (a glob resolving to nothing must never be a silent pass).
          for f in test/deltaTestnet*.cjs test/fyersSandbox*.cjs; do :; done
          [ "$WANT_DELTA" = "1" ] && ! ls test/deltaTestnet*.cjs >/dev/null 2>&1 && { echo "::error::delta sandbox suite file missing"; exit 1; }
          [ "$WANT_FYERS" = "1" ] && ! ls test/fyersSandbox*.cjs >/dev/null 2>&1 && { echo "::error::fyers sandbox suite file missing"; exit 1; }
          {
            echo "commit=${GITHUB_SHA}"
            echo "cert_brokers=${CB}  want_fyers=${WANT_FYERS}  want_delta=${WANT_DELTA}"
            echo "release_branch=${IS_RELEASE_BRANCH}  real_money_release=${REAL_MONEY}  require_cert=${REQ_EXPLICIT}  required=${REQUIRED}"
            echo "fyers_creds=${FYERS_OK}  delta_creds=${DELTA_OK}"
            echo "run_files=${FILES}"
          } | tee artifacts/broker-sandbox.txt
          # R37-P1-01 + R38: when certification is REQUIRED, every WANTED broker must have complete creds. A broker not in
          # CERT_BROKERS is not required and stays uncertified (NO-GO for that broker), so real money can't be granted to it.
          MISSING=""
          [ "$WANT_DELTA" = "1" ] && [ "$DELTA_OK" = "0" ] && MISSING="$MISSING delta"
          [ "$WANT_FYERS" = "1" ] && [ "$FYERS_OK" = "0" ] && MISSING="$MISSING fyers"
          if [ "$REQUIRED" = "1" ] && [ -n "$MISSING" ]; then
            echo "broker_sandbox=NOT_CERTIFIED (certification REQUIRED but complete sandbox creds are missing for:${MISSING})" | tee -a artifacts/broker-sandbox.txt
            echo "::error::NO-GO — real-money release requires complete sandbox credentials for every CERT_BROKERS entry (${CB}); missing:${MISSING}"; exit 1
          fi
          if [ -z "$FILES" ]; then
            # No wanted broker has creds. REQUIRED is already handled above, so here certification is NOT required.
            echo "broker_sandbox=NOT_CONFIGURED (set complete creds for CERT_BROKERS=${CB} + vars.REAL_MONEY_RELEASE=1 on main to certify)" | tee -a artifacts/broker-sandbox.txt
            echo "::warning::broker-sandbox credentials absent for the wanted brokers — real order paths NOT certified this run"; exit 0
          fi
          # Run ONLY the wanted+credentialed suites. `set -o pipefail` makes a Node failure fail the step.
          BROKER_SANDBOX=1 node --test $FILES 2>&1 | tee -a artifacts/broker-sandbox.tap
          PASS=$(grep -c '^ok ' artifacts/broker-sandbox.tap || true)
          FAIL=$(grep -c '^not ok ' artifacts/broker-sandbox.tap || true)
          SKIP=$(grep -Ec '^(ok|not ok) .*# (SKIP|skip)\b' artifacts/broker-sandbox.tap || true)
          echo "pass=${PASS} fail=${FAIL} skipped=${SKIP}" | tee -a artifacts/broker-sandbox.txt
          # A real certification requires pass>0, fail=0 AND skipped=0 (no vacuous/absent execution).
          if [ "${PASS:-0}" -le 0 ] || [ "${FAIL:-0}" -ne 0 ] || [ "${SKIP:-0}" -ne 0 ]; then
            echo "::error::broker-sandbox certification invalid (need pass>0, fail=0, skipped=0)"; exit 1
          fi
      - name: Upload broker-sandbox evidence (per-SHA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broker-sandbox-evidence-${{ github.sha }}
          path: artifacts/
          retention-days: 90

  # R39-P1-03: DELTA testnet CERTIFICATION on the STATIC-IP self-hosted runner (Delta whitelists egress IPs, so the raw
  # Delta order-lifecycle + fill-verification cert can't run on GitHub's shared runners). Produces the per-SHA
  # `broker-sandbox-delta-evidence-<sha>` artifact the reviewer wants for P1-01. Gated on vars.CERT_DELTA=1 + secrets.
  broker-sandbox-delta:
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && vars.CERT_DELTA == '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Delta testnet order + fill certification (self-hosted, whitelisted IP)
        env:
          DELTA_SANDBOX_KEY: ${{ secrets.DELTA_SANDBOX_KEY }}
          DELTA_SANDBOX_SECRET: ${{ secrets.DELTA_SANDBOX_SECRET }}
          DELTA_SANDBOX_BASE: ${{ vars.DELTA_SANDBOX_BASE }}
          DELTA_SANDBOX_SYMBOL: ${{ vars.DELTA_SANDBOX_SYMBOL }}
          DELTA_SANDBOX_MAX_SIZE: ${{ vars.DELTA_SANDBOX_MAX_SIZE }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ -z "${DELTA_SANDBOX_KEY:-}" ] || [ -z "${DELTA_SANDBOX_SECRET:-}" ] || [ -z "${DELTA_SANDBOX_BASE:-}" ]; then
            echo "broker_delta=NOT_CONFIGURED" | tee artifacts/broker-sandbox-delta.txt
            echo "::error::CERT_DELTA=1 but Delta testnet secrets/base are missing"; exit 1
          fi
          ls test/deltaTestnet*.cjs >/dev/null 2>&1 || { echo "::error::delta sandbox suite file missing"; exit 1; }
          BROKER_SANDBOX=1 node --test test/deltaTestnet*.cjs 2>&1 | tee artifacts/broker-sandbox-delta.tap
          PASS=$(grep -c '^ok ' artifacts/broker-sandbox-delta.tap || true)
          FAIL=$(grep -c '^not ok ' artifacts/broker-sandbox-delta.tap || true)
          SKIP=$(grep -Ec '^(ok|not ok) .*# (SKIP|skip)\b' artifacts/broker-sandbox-delta.tap || true)
          echo "commit=${GITHUB_SHA} want_delta=1 pass=${PASS} fail=${FAIL} skipped=${SKIP}" | tee artifacts/broker-sandbox-delta.txt
          if [ "${PASS:-0}" -le 0 ] || [ "${FAIL:-0}" -ne 0 ] || [ "${SKIP:-0}" -ne 0 ]; then
            echo "broker_delta=NOT_CERTIFIED" | tee -a artifacts/broker-sandbox-delta.txt
            echo "::error::Delta certification invalid (need pass>0, fail=0, skipped=0)"; exit 1
          fi
          echo "broker_delta=CERTIFIED" | tee -a artifacts/broker-sandbox-delta.txt
      - name: Upload Delta certification evidence (per-SHA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broker-sandbox-delta-evidence-${{ github.sha }}
          path: artifacts/
          retention-days: 90

  # R39-P1-03: MatrixOne-PATH real-broker E2E on a STATIC-IP self-hosted runner. Delta whitelists egress IPs, so this
  # can't run on GitHub's shared runners — it targets `runs-on: [self-hosted, linux]` (register the Oracle VM as a
  # repo runner with those labels). It boots a REAL PostgreSQL service + drives an order through MatrixOne's own route
  # against the Delta TESTNET, proving entry→journal→protection→reduce-only close→idempotency→recovery→single-owner.
  # Gated: runs only when vars.RUN_BROKER_E2E=1 AND the Delta testnet secrets are present; otherwise it no-ops.
  broker-e2e:
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && vars.RUN_BROKER_E2E == '1' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: matrix
          POSTGRES_PASSWORD: matrix
          POSTGRES_DB: matrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: MatrixOne-path Delta testnet E2E
        env:
          CI: 'true'
          BROKER_E2E: '1'
          DATABASE_URL: postgres://matrix:matrix@localhost:5432/matrix_test
          DELTA_SANDBOX_KEY: ${{ secrets.DELTA_SANDBOX_KEY }}
          DELTA_SANDBOX_SECRET: ${{ secrets.DELTA_SANDBOX_SECRET }}
          DELTA_SANDBOX_BASE: ${{ vars.DELTA_SANDBOX_BASE }}
          DELTA_SANDBOX_SYMBOL: ${{ vars.DELTA_SANDBOX_SYMBOL }}
          DELTA_SANDBOX_MAX_SIZE: ${{ vars.DELTA_SANDBOX_MAX_SIZE }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ -z "${DELTA_SANDBOX_KEY:-}" ] || [ -z "${DELTA_SANDBOX_SECRET:-}" ] || [ -z "${DELTA_SANDBOX_BASE:-}" ]; then
            echo "::error::broker-e2e is enabled (RUN_BROKER_E2E=1) but Delta testnet secrets/base are missing"; exit 1
          fi
          node --test --test-force-exit test/brokerPipelineE2E.sandbox.cjs 2>&1 | tee artifacts/broker-e2e.tap
          PASS=$(grep -c '^ok ' artifacts/broker-e2e.tap || true)
          FAIL=$(grep -c '^not ok ' artifacts/broker-e2e.tap || true)
          SKIP=$(grep -Ec '^(ok|not ok) .*# (SKIP|skip)\b' artifacts/broker-e2e.tap || true)
          echo "commit=${GITHUB_SHA} pass=${PASS} fail=${FAIL} skipped=${SKIP}" | tee artifacts/broker-e2e.txt
          # A real certification: pass>0, fail=0, skipped=0 (no vacuous run).
          if [ "${PASS:-0}" -le 0 ] || [ "${FAIL:-0}" -ne 0 ] || [ "${SKIP:-0}" -ne 0 ]; then
            echo "::error::MatrixOne-path E2E invalid (need pass>0, fail=0, skipped=0)"; exit 1
          fi
      - name: Upload broker-e2e evidence (per-SHA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broker-e2e-evidence-${{ github.sha }}
          path: artifacts/
          retention-days: 90

  # R41-P1-04: REAL lost-response → process death → restart → adopt-once journey on the STATIC-IP self-hosted runner.
  # Proves the crash-recovery path the in-process E2E cannot: a child places a real testnet order + hard-dies before
  # finalize; this job (same PG) reconciles from broker truth and asserts exactly-one order/fill/adoption. Same gate as
  # the E2E (RUN_BROKER_E2E=1 + Delta testnet secrets).
  restart-adoption:
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && vars.RUN_BROKER_E2E == '1' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: matrix
          POSTGRES_PASSWORD: matrix
          POSTGRES_DB: matrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Restart-adoption crash-recovery journey (self-hosted, whitelisted IP)
        env:
          BROKER_SANDBOX: '1'
          DATABASE_URL: postgres://matrix:matrix@localhost:5432/matrix_test
          DELTA_SANDBOX_KEY: ${{ secrets.DELTA_SANDBOX_KEY }}
          DELTA_SANDBOX_SECRET: ${{ secrets.DELTA_SANDBOX_SECRET }}
          DELTA_SANDBOX_BASE: ${{ vars.DELTA_SANDBOX_BASE }}
          DELTA_SANDBOX_SYMBOL: ${{ vars.DELTA_SANDBOX_SYMBOL }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ -z "${DELTA_SANDBOX_KEY:-}" ] || [ -z "${DELTA_SANDBOX_SECRET:-}" ] || [ -z "${DELTA_SANDBOX_BASE:-}" ]; then
            echo "::error::restart-adoption enabled but Delta testnet secrets/base are missing"; exit 1
          fi
          node --test --test-force-exit test/restartAdoption.sandbox.cjs 2>&1 | tee artifacts/restart-adoption.tap
          PASS=$(grep -c '^ok ' artifacts/restart-adoption.tap || true)
          FAIL=$(grep -c '^not ok ' artifacts/restart-adoption.tap || true)
          SKIP=$(grep -Ec '^(ok|not ok) .*# (SKIP|skip)\b' artifacts/restart-adoption.tap || true)
          echo "commit=${GITHUB_SHA} pass=${PASS} fail=${FAIL} skipped=${SKIP}" | tee artifacts/restart-adoption.txt
          if [ "${PASS:-0}" -le 0 ] || [ "${FAIL:-0}" -ne 0 ] || [ "${SKIP:-0}" -ne 0 ]; then
            echo "::error::restart-adoption invalid (need pass>0, fail=0, skipped=0)"; exit 1
          fi
      - name: Upload restart-adoption evidence (per-SHA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restart-adoption-evidence-${{ github.sha }}
          path: artifacts/
          retention-days: 90

  # R42-P1-07: TWO real workers race ONE signal to the broker on the STATIC-IP self-hosted runner — proving exactly-one
  # broker send + one fill + fenced ownership/takeover (no resend), using the production lease/claimSignal/submitWithAttempt.
  two-worker:
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && vars.RUN_BROKER_E2E == '1' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: matrix
          POSTGRES_PASSWORD: matrix
          POSTGRES_DB: matrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Two-worker exactly-once + fenced failover (self-hosted, whitelisted IP)
        env:
          BROKER_SANDBOX: '1'
          DATABASE_URL: postgres://matrix:matrix@localhost:5432/matrix_test
          DELTA_SANDBOX_KEY: ${{ secrets.DELTA_SANDBOX_KEY }}
          DELTA_SANDBOX_SECRET: ${{ secrets.DELTA_SANDBOX_SECRET }}
          DELTA_SANDBOX_BASE: ${{ vars.DELTA_SANDBOX_BASE }}
          DELTA_SANDBOX_SYMBOL: ${{ vars.DELTA_SANDBOX_SYMBOL }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ -z "${DELTA_SANDBOX_KEY:-}" ] || [ -z "${DELTA_SANDBOX_SECRET:-}" ] || [ -z "${DELTA_SANDBOX_BASE:-}" ]; then
            echo "::error::two-worker enabled but Delta testnet secrets/base are missing"; exit 1
          fi
          node --test --test-force-exit test/twoWorkerExactlyOnce.sandbox.cjs 2>&1 | tee artifacts/two-worker.tap
          PASS=$(grep -c '^ok ' artifacts/two-worker.tap || true)
          FAIL=$(grep -c '^not ok ' artifacts/two-worker.tap || true)
          SKIP=$(grep -Ec '^(ok|not ok) .*# (SKIP|skip)\b' artifacts/two-worker.tap || true)
          echo "commit=${GITHUB_SHA} pass=${PASS} fail=${FAIL} skipped=${SKIP}" | tee artifacts/two-worker.txt
          if [ "${PASS:-0}" -le 0 ] || [ "${FAIL:-0}" -ne 0 ] || [ "${SKIP:-0}" -ne 0 ]; then
            echo "::error::two-worker invalid (need pass>0, fail=0, skipped=0)"; exit 1
          fi
      - name: Upload two-worker evidence (per-SHA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-worker-evidence-${{ github.sha }}
          path: artifacts/
          retention-days: 90

  # R41-P1-06: INDEPENDENT emergency-flatten watchdog. Runs AFTER the order-placing jobs with `if: always()` — so even
  # if a job crashed/was cancelled mid-order, this separate process (its own creds + bounded expiry) reads broker truth,
  # flattens the allow-listed testnet account, proves flat, and PAGES (fails) if it can't. This is the backstop for the
  # exact failure class being certified; it is NOT itself a certification.
  watchdog-flatten:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    needs: [broker-e2e, restart-adoption, two-worker]
    if: ${{ always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && vars.RUN_BROKER_E2E == '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Independent flatten + prove-flat (bounded)
        env:
          # R42-P1-06: the watchdog PREFERS dedicated credentials (DELTA_WATCHDOG_KEY/SECRET) for true independence, but
          # STRICT is intentionally OFF here (per operator choice) so it FALLS BACK to the sandbox creds when no dedicated
          # key is set — it still authenticates and proves-flat; it just shares fate with the test's credential. Set
          # DELTA_WATCHDOG_KEY/SECRET (a second testnet key) and flip WATCHDOG_STRICT to '1' later for full independence.
          DELTA_WATCHDOG_KEY: ${{ secrets.DELTA_WATCHDOG_KEY }}
          DELTA_WATCHDOG_SECRET: ${{ secrets.DELTA_WATCHDOG_SECRET }}
          DELTA_SANDBOX_KEY: ${{ secrets.DELTA_SANDBOX_KEY }}
          DELTA_SANDBOX_SECRET: ${{ secrets.DELTA_SANDBOX_SECRET }}
          DELTA_SANDBOX_BASE: ${{ vars.DELTA_SANDBOX_BASE }}
          WATCHDOG_SYMBOL: ${{ vars.DELTA_SANDBOX_SYMBOL }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          WATCHDOG_EVIDENCE=artifacts/watchdog-flatten.txt node test/watchdogFlatten.sandbox.cjs
      - name: Upload watchdog evidence (per-SHA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-flatten-evidence-${{ github.sha }}
          path: artifacts/
          retention-days: 90

  # R39-P3-01: PROTECTED real-money deployment gate. This job is the enforcement point the docs described but the
  # workflow lacked. It runs ONLY on the release branch when vars.REAL_MONEY_RELEASE=1, `needs:` the backend + broker
  # certification jobs (so it can't start unless both SUCCEEDED), and binds to a PROTECTED `environment:` — configure
  # `production` in Settings → Environments with required reviewers so activation needs a human approval and can't be
  # bypassed by a push. It then re-VERIFIES the per-SHA evidence CONTENTS (not just job success): the backend suite is
  # green with zero skips for THIS commit, and every CERT_BROKERS broker is actually certified (pass>0, fail=0, skip=0,
  # no NOT_CERTIFIED/NOT_CONFIGURED). Real-money activation is emitted only when all checks pass.
  deploy:
    # R40-P2-02: depend on ALL certification jobs so deploy can't start before their per-SHA evidence exists (no race).
    # When their flags are off the jobs are skipped and deploy is skipped too — an unattended real-money release requires
    # them ON (enforced below), so for a real release they always run and gate this job.
    needs: [backend, broker-sandbox, broker-sandbox-delta, broker-e2e, restart-adoption, two-worker, watchdog-flatten]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && vars.REAL_MONEY_RELEASE == '1' }}
    environment: production   # protected: add required reviewers in repo Settings → Environments
    steps:
      - name: Download backend evidence (this SHA)
        uses: actions/download-artifact@v4
        with:
          name: backend-evidence-${{ github.sha }}
          path: ev-backend
      - name: Download FYERS broker-sandbox evidence (this SHA)
        uses: actions/download-artifact@v4
        with:
          name: broker-sandbox-evidence-${{ github.sha }}
          path: ev-broker
      - name: Download Delta certification evidence (this SHA)
        if: ${{ vars.CERT_DELTA == '1' }}
        uses: actions/download-artifact@v4
        with:
          name: broker-sandbox-delta-evidence-${{ github.sha }}
          path: ev-delta
      - name: Download MatrixOne-path E2E evidence (this SHA)
        if: ${{ vars.RUN_BROKER_E2E == '1' }}
        uses: actions/download-artifact@v4
        with:
          name: broker-e2e-evidence-${{ github.sha }}
          path: ev-e2e
      - name: Download restart-adoption evidence (this SHA)
        if: ${{ vars.RUN_BROKER_E2E == '1' }}
        uses: actions/download-artifact@v4
        with:
          name: restart-adoption-evidence-${{ github.sha }}
          path: ev-restart
      - name: Download two-worker evidence (this SHA)
        if: ${{ vars.RUN_BROKER_E2E == '1' }}
        uses: actions/download-artifact@v4
        with:
          name: two-worker-evidence-${{ github.sha }}
          path: ev-twoworker
      - name: Download watchdog evidence (this SHA)
        if: ${{ vars.RUN_BROKER_E2E == '1' }}
        uses: actions/download-artifact@v4
        with:
          name: watchdog-flatten-evidence-${{ github.sha }}
          path: ev-watchdog
      - name: Verify certified evidence before real-money activation
        env:
          CERT_BROKERS: ${{ vars.CERT_BROKERS }}
          CERT_DELTA: ${{ vars.CERT_DELTA }}
          RUN_BROKER_E2E: ${{ vars.RUN_BROKER_E2E }}
          APPROVED_FRONTEND_BUILD: ${{ vars.APPROVED_FRONTEND_BUILD }}
        run: |
          set -euo pipefail
          # R40-P1-05: an UNATTENDED real-money release (this job runs only when REAL_MONEY_RELEASE=1) must NEVER pass
          # without the MatrixOne-path E2E. Require RUN_BROKER_E2E=1 unconditionally — no optional-flag bypass.
          [ "${RUN_BROKER_E2E:-0}" = "1" ] || { echo "::error::unattended real-money release requires RUN_BROKER_E2E=1 (the MatrixOne-path app E2E must run and be verified)"; exit 1; }
          BE=ev-backend/backend-evidence.txt
          [ -f "$BE" ] || { echo "::error::missing backend evidence for ${GITHUB_SHA}"; exit 1; }
          # 1) Backend evidence must be for THIS commit, green, zero-skip.
          grep -q "commit=${GITHUB_SHA}" "$BE" || { echo "::error::backend evidence commit mismatch (artifact is not for ${GITHUB_SHA})"; exit 1; }
          grep -q "^fail=0" "$BE" || { echo "::error::backend evidence shows failures"; exit 1; }
          grep -q "^skipped=0" "$BE" || { echo "::error::backend evidence shows skipped tests"; exit 1; }
          CB=$(echo "${CERT_BROKERS:-fyers}" | tr 'A-Z' 'a-z')
          # 2) FYERS (shared runner) — required only if named in CERT_BROKERS.
          if echo "$CB" | grep -qw fyers; then
            BS=ev-broker/broker-sandbox.txt
            [ -f "$BS" ] || { echo "::error::missing FYERS broker-sandbox evidence"; exit 1; }
            if grep -Eq 'NOT_CERTIFIED|NOT_CONFIGURED|fyers-not-requested' "$BS"; then echo "::error::FYERS was not certified for a real-money release"; exit 1; fi
            grep -Eq 'pass=[1-9][0-9]* fail=0 skipped=0' "$BS" || { echo "::error::FYERS evidence is not a clean pass>0/fail=0/skipped=0"; exit 1; }
            grep -q 'want_fyers=1' "$BS" || { echo "::error::FYERS evidence does not confirm it ran"; exit 1; }
          fi
          # 3) DELTA (self-hosted, whitelisted IP) — required if named in CERT_BROKERS. Its evidence comes from the
          #    dedicated broker-sandbox-delta job, which only runs when CERT_DELTA=1.
          if echo "$CB" | grep -qw delta; then
            [ "${CERT_DELTA:-0}" = "1" ] || { echo "::error::delta is in CERT_BROKERS but CERT_DELTA!=1 (the self-hosted Delta cert job did not run)"; exit 1; }
            DS=ev-delta/broker-sandbox-delta.txt
            [ -f "$DS" ] || { echo "::error::missing Delta certification evidence for ${GITHUB_SHA}"; exit 1; }
            grep -q "commit=${GITHUB_SHA}" "$DS" || { echo "::error::Delta evidence commit mismatch"; exit 1; }
            grep -q 'broker_delta=CERTIFIED' "$DS" || { echo "::error::Delta was not CERTIFIED"; exit 1; }
          fi
          # 4) MatrixOne-path E2E — required for unattended automation; gated by RUN_BROKER_E2E.
          if [ "${RUN_BROKER_E2E:-0}" = "1" ]; then
            EE=ev-e2e/broker-e2e.txt
            [ -f "$EE" ] || { echo "::error::missing MatrixOne-path E2E evidence for ${GITHUB_SHA}"; exit 1; }
            grep -q "commit=${GITHUB_SHA}" "$EE" || { echo "::error::E2E evidence commit mismatch"; exit 1; }
            grep -Eq 'pass=[1-9][0-9]* fail=0 skipped=0' "$EE" || { echo "::error::MatrixOne-path E2E is not a clean pass>0/fail=0/skipped=0"; exit 1; }
            # R41-P1-04: the REAL lost-response → restart → adopt-once journey must also be green for THIS SHA.
            RA=ev-restart/restart-adoption.txt
            [ -f "$RA" ] || { echo "::error::missing restart-adoption evidence for ${GITHUB_SHA}"; exit 1; }
            grep -q "commit=${GITHUB_SHA}" "$RA" || { echo "::error::restart-adoption evidence commit mismatch"; exit 1; }
            grep -Eq 'pass=[1-9][0-9]* fail=0 skipped=0' "$RA" || { echo "::error::restart-adoption is not a clean pass>0/fail=0/skipped=0"; exit 1; }
            # R42-P1-07: the two-worker exactly-once + fenced-failover journey must also be green for THIS SHA.
            TW=ev-twoworker/two-worker.txt
            [ -f "$TW" ] || { echo "::error::missing two-worker evidence for ${GITHUB_SHA}"; exit 1; }
            grep -q "commit=${GITHUB_SHA}" "$TW" || { echo "::error::two-worker evidence commit mismatch"; exit 1; }
            grep -Eq 'pass=[1-9][0-9]* fail=0 skipped=0' "$TW" || { echo "::error::two-worker is not a clean pass>0/fail=0/skipped=0"; exit 1; }
            # R42-P1-06: the INDEPENDENT watchdog must have authenticated (dedicated creds) and PROVED the account flat —
            # a SKIP/REFUSE/FAIL/PAGE (or a missing artifact) blocks the release. Cleanup that never ran is not a net.
            WD=ev-watchdog/watchdog-flatten.txt
            [ -f "$WD" ] || { echo "::error::missing watchdog evidence for ${GITHUB_SHA}"; exit 1; }
            grep -Eq 'result=(FLAT|FLATTENED)' "$WD" || { echo "::error::watchdog did not PROVE the testnet account flat (need result=FLAT|FLATTENED); saw: $(cat "$WD")"; exit 1; }
            if grep -Eq 'result=(SKIP|REFUSE|FAIL|PAGE|ERROR)' "$WD"; then echo "::error::watchdog evidence shows a non-clean result: $(cat "$WD")"; exit 1; fi
          fi
          # 5) R41-P2-03 — FE/BE RELEASE BINDING. A real-money backend release must be bound to an APPROVED frontend
          #    build so an incompatible FE/BE pair can't be activated. The approved FE build digest is promoted from the
          #    frontend repo's release (vars.APPROVED_FRONTEND_BUILD); it is stamped into the deployed backend env as
          #    FRONTEND_BUILD_ID and re-verified post-deploy against /api/version.frontendBuild.
          [ -n "${APPROVED_FRONTEND_BUILD:-}" ] || { echo "::error::real-money release requires vars.APPROVED_FRONTEND_BUILD (approved frontend build digest) to bind FE/BE identity"; exit 1; }
          echo "deploy_gate=GO commit=${GITHUB_SHA} cert_brokers=${CB} cert_delta=${CERT_DELTA:-0} e2e=${RUN_BROKER_E2E:-0} frontend_build=${APPROVED_FRONTEND_BUILD}"
          echo "::notice::Real-money release evidence verified for ${GITHUB_SHA} (frontend ${APPROVED_FRONTEND_BUILD}). Proceeding to protected deployment."
          # (Real deployment / capability activation step goes here — kept as the single gated point. It MUST deploy the
          #  attested backend digest with FRONTEND_BUILD_ID=${APPROVED_FRONTEND_BUILD} in the service env, then the
          #  post-deploy provenance step below proves the running binary + bound frontend match this evidence.)
      - name: Post-deploy provenance — prove production runs the certified SHA + bound frontend (R41-P2-02/03)
        env:
          PROD_HEALTHCHECK_URL: ${{ vars.PROD_HEALTHCHECK_URL }}
          APPROVED_FRONTEND_BUILD: ${{ vars.APPROVED_FRONTEND_BUILD }}
        run: |
          set -euo pipefail
          # Evidence-verified is NOT deployment-proven. After the protected deploy, the RUNNING backend must report the
          # exact commit we certified AND the bound approved frontend build. Without this, the gate only proves the
          # verifier ran, not that the reviewed SHA is live. A real-money release MUST configure vars.PROD_HEALTHCHECK_URL.
          [ -n "${PROD_HEALTHCHECK_URL:-}" ] || { echo "::error::real-money release requires vars.PROD_HEALTHCHECK_URL to prove the running production version"; exit 1; }
          COMMIT=""; BODY=""
          for i in $(seq 1 30); do
            BODY=$(curl -fsS "${PROD_HEALTHCHECK_URL%/}/api/version" || true)
            COMMIT=$(printf '%s' "$BODY" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
            [ "$COMMIT" = "${GITHUB_SHA}" ] && break
            echo "waiting for production to report ${GITHUB_SHA} (saw '${COMMIT:-none}')…"; sleep 10
          done
          [ "$COMMIT" = "${GITHUB_SHA}" ] || { echo "::error::production /api/version commit '${COMMIT:-none}' != certified ${GITHUB_SHA} — the reviewed SHA is NOT the running binary"; exit 1; }
          FE=$(printf '%s' "$BODY" | sed -n 's/.*"frontendBuild":"\([^"]*\)".*/\1/p')
          [ "$FE" = "${APPROVED_FRONTEND_BUILD}" ] || { echo "::error::production frontendBuild '${FE:-none}' != approved '${APPROVED_FRONTEND_BUILD}' — FE/BE identity mismatch"; exit 1; }
          echo "::notice::Post-deploy provenance verified — production runs ${GITHUB_SHA} with bound frontend ${FE}."
