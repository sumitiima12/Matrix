name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: matrix
          POSTGRES_PASSWORD: matrix
          POSTGRES_DB: matrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Syntax check
        run: node --check server.js && node --check db.js && node --check auth.js && node --check riskEngine.js
      - name: Unit tests (risk, parity, reconcile, idempotency, claims)
        run: npm test
      - name: Postgres integration tests (journal safety invariants)
        env:
          DATABASE_URL: postgres://matrix:matrix@localhost:5432/matrix_test
        run: node --test test/pgIntegration.test.cjs
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
